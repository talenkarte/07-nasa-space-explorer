<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>

  <!-- Public Sans is the typeface used by NASA's web design system -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <!-- Animated background: twinkling, drifting stars + floating planets -->
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="planets" aria-hidden="true">
    <div class="planet planet-ringed"><span class="ring"></span></div>
    <div class="planet planet-red"></div>
    <div class="planet planet-blue"><span class="moon"></span></div>
    <div class="planet planet-small"></div>
  </div>

  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <!-- Random "Did You Know?" fact (filled in by script.js) -->
    <section class="fact-box" aria-live="polite">
      <span class="fact-icon" aria-hidden="true">💡</span>
      <p><strong>Did you know?</strong> <span id="factText"></span></p>
    </section>

    <div class="filters">
      <label class="visually-hidden" for="startDate">Start date</label>
      <input type="date" id="startDate" />
      <label class="visually-hidden" for="endDate">End date</label>
      <input type="date" id="endDate" />
      <button id="getImagesBtn" type="button">Get Space Images</button>
    </div>

    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <!-- Modal for a single APOD entry -->
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" type="button" aria-label="Close" data-close>&times;</button>
      <div id="modalMedia" class="modal-media"></div>
      <div class="modal-body">
        <h2 id="modalTitle"></h2>
        <p id="modalDate" class="modal-date"></p>
        <p id="modalExplanation" class="modal-explanation"></p>
        <p id="modalCopyright" class="modal-copyright"></p>
      </div>
    </div>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
